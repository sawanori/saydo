name: Saydo

options:
  bundleIdPrefix: com.nonturn
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  Saydo:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: Saydo
        PRODUCT_BUNDLE_IDENTIFIER: com.nonturn.saydo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: SAYDO
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: あなたの声を録音し、逃げたいことを言葉にするために使います
        UILaunchScreen: {}

  SaydoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/SaydoTests
    dependencies:
      - target: Saydo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nonturn.saydo.tests
        GENERATE_INFOPLIST_FILE: YES

  SpeechSpike:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Spikes/SpeechSpike
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: SpeechSpike
        PRODUCT_BUNDLE_IDENTIFIER: com.nonturn.saydo.speechspike
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Spikes/SpeechSpike/Info.plist
      properties:
        CFBundleDisplayName: SpeechSpike
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 音声パイプラインの検証のために録音します
        UILaunchScreen: {}

  fm-probe:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Spikes/fm-probe
    settings:
      base:
        PRODUCT_NAME: fm-probe
        PRODUCT_BUNDLE_IDENTIFIER: com.nonturn.saydo.fmprobe

schemes:
  Saydo:
    build:
      targets:
        Saydo: all
        SaydoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SaydoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  SpeechSpike:
    build:
      targets:
        SpeechSpike: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  fm-probe:
    build:
      targets:
        fm-probe: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
